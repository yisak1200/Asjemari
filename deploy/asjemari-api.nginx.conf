# Include these directives in the HTTPS server block for
# asjemari.bookhakim.com.et. The request limit accommodates a 50 MB pitch deck,
# two 15 MB Fayda images, and multipart overhead on slower mobile connections.
client_max_body_size 110m;
client_body_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# Nginx handles an oversized body before Django/CORS middleware runs. Return a
# same-policy JSON error so browsers can expose the real message to the app.
error_page 413 = @asjemari_upload_too_large;

location @asjemari_upload_too_large {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://asjemari.com.et" always;
    add_header Vary "Origin" always;
    return 413 '{"error":"The total upload must be 110 MB or smaller."}';
}
