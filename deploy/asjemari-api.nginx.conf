# Include these directives in the HTTPS server block for
# asjemari.bookhakim.com.et. The request limit accommodates a 10 MB pitch deck,
# two 5 MB Fayda images, and multipart overhead.
client_max_body_size 25m;
client_body_timeout 120s;

# Nginx handles an oversized body before Django/CORS middleware runs. Return a
# same-policy JSON error so browsers can expose the real message to the app.
error_page 413 = @asjemari_upload_too_large;

location @asjemari_upload_too_large {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://asjemari.com.et" always;
    add_header Vary "Origin" always;
    return 413 '{"error":"The total upload must be 25 MB or smaller."}';
}
