# Load this file from nginx's http context (Ubuntu/Debian loads
# /etc/nginx/conf.d/*.conf there by default). It keeps slow mobile uploads from
# being rejected before Django can validate and store them.
client_max_body_size 110M;
client_body_timeout 300s;
send_timeout 300s;

# Allow Gunicorn enough time to receive/process multipart uploads on slower
# mobile connections.
proxy_connect_timeout 60s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
